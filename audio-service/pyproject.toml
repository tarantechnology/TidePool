[project]
name = "sam-audio-service"
version = "0.1.0"
description = "SoundCanvas audio inference service (Person 1): SAM Audio text/visual/span-prompted separation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-multipart>=0.0.9",
    "pydantic>=2.7,<3",
    "numpy>=1.26",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2.3"]
# Real model runtime. SAM Audio is not on PyPI; it is installed from GitHub and pulls
# several git dependencies itself (dacvae, perception_models, ImageBind, CLAP).
sam = [
    "torch>=2.4",
    "torchaudio>=2.4",
    "torchcodec>=0.2",
    # Verified 2026-11-06 on the first real load: sam_audio's BaseModel._from_pretrained requires
    # the `proxies` / `resume_download` keyword arguments that huggingface_hub >= 1.0 no longer
    # passes (TypeError at load). 0.x works; transformers 4.x is the matching series.
    "huggingface_hub>=0.25,<1",
    "transformers>=4.54,<5",
    "sam_audio @ git+https://github.com/facebookresearch/sam-audio.git",
]
# Music stems (AUDIO_STEM_SPLITTER=demucs) and the AST content classifier
# (AUDIO_ROUTER_CLASSIFIER=ast). Lower bounds only: demucs 4.0.1 is the release with
# htdemucs/htdemucs_ft/htdemucs_6s; ASTForAudioClassification has been in transformers since
# 4.25. Tested pins come from the Phase 0 benchmark (scripts/setup_music_stems_venv.sh).
music = [
    "torch>=2.4",
    "demucs>=4.0.1",
    "transformers>=4.25",
    # PANNs Cnn14, the default router classifier (AUDIO_ROUTER_CLASSIFIER=panns); 0.1.1 tested.
    "panns-inference>=0.1.1",
]
# AUDIO_STEM_SPLITTER=chain additionally runs a RoFormer vocal model through audio-separator.
music-chain = [
    "audio-separator>=0.17",
]
# AUDIO_STEM_SPLITTER=roformer: native multi-stem BS-RoFormer built from its training YAML.
music-roformer = [
    "torch>=2.4",
    "bs-roformer>=0.3",
    "pyyaml>=6",
]

# Phase E (generate a part that fits the song). The pipeline itself is numpy-only (numpy beat
# tracker, chroma chords, rule-based composer, built-in synth); these add the model backends.
# Tested 2026-11-14 on the A40 with torch 2.8.0+cu128 / transformers 5.23 (see README "Generate parts").
# basic-pitch is installed with --no-deps (its Linux extras pin TF/tflite); it runs the bundled ONNX
# model through onnxruntime. System: `apt install fluidsynth fluid-soundfont-gm` for the GM renderer.
generate = [
    "torch>=2.4",
    "transformers>=4.40",
    "safetensors>=0.4",
    "huggingface_hub>=0.25",
    "onnxruntime>=1.17",
    "librosa>=0.10",       # Basic Pitch's audio loading
    "pretty_midi>=0.2.10", # Basic Pitch note output
    "mir_eval>=0.7",
    "soxr>=0.3",           # beat_this resampling
    "einops>=0.7",
    "rotary-embedding-torch>=0.5",
    "beat_this @ git+https://github.com/CPJKU/beat_this@b95c8ab0c58c2d9fcfd40508ae8dffbc05ac4f5c",
    "anticipation @ git+https://github.com/jthickstun/anticipation@af37397922665a0fb8d474d7988b0f3755a38d45",
    "midiutil>=1.2",
]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sam_audio_service*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 300
