[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soundcanvas-cv"
version = "1.0.0"
description = "SoundCanvas Part 2: visual detection, tracking, selection and prompt preparation"
requires-python = ">=3.11"
dependencies = ["ultralytics>=8.4,<9", "opencv-python>=4.8,<5", "lap>=0.5.12"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "jsonschema>=4,<5", "playwright>=1.50,<2"]

[tool.setuptools.packages.find]
include = ["soundcanvas_cv*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["real: opt-in pretrained YOLO inference using downloaded media and weights", "browser: opt-in Chromium tests"]
